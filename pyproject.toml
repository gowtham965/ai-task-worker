[project]
name = "ai-task-worker"
version = "0.1.0"
description = "An autonomous AI task worker that operates a simulated company's tools, with verified, evidence-backed outcomes."
authors = [
    { name = "Gowtham Gowda", email = "gouthamgowda965@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.24.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
company = "company.server:main"
worker = "worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company", "src/worker"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
