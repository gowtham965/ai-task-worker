<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>{% block title %}Northwind Ops{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#1d2330}
header{background:#1f3a5f;color:#fff;padding:10px 20px;display:flex;gap:18px;align-items:center}
header a{color:#cfe0f5;text-decoration:none}header strong{margin-right:12px}
main{max-width:980px;margin:20px auto;background:#fff;padding:20px 26px;border-radius:6px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e3e6ea;padding:7px;text-align:left;font-size:14px}
.err{background:#fde8e8;color:#8a1c1c;padding:8px 12px;border-radius:4px;margin:6px 0}
.ok{background:#e6f4ea;color:#1e6b34;padding:8px 12px;border-radius:4px}
label{display:block;margin-top:10px;font-weight:600;font-size:14px}input,select{padding:6px;width:320px}
button{margin-top:14px;padding:8px 16px;background:#1f3a5f;color:#fff;border:0;border-radius:4px;cursor:pointer}
pre{white-space:pre-wrap;font-family:inherit}
</style></head><body>
<header><strong>{% block brand %}Northwind Ops{% endblock %}</strong>{% block nav %}<a href="/">Home</a><a href="/mail/">Mail</a><a href="/erp/">ERP</a><a href="/wiki/">Wiki</a>{% endblock %}</header>
<main>{% block body %}{% endblock %}</main></body></html>
